<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
        <style>
             * { text-align: center; }
              body { font-family: Arial, sans-serif; background-color: #f2f2f2; }
             form { background-color: white; width: 350px; margin: 50px auto; padding: 25px; border-radius: 10px; box-shadow: 0 0 10px gray; } input { padding: 8px; margin: 5px; border: 1px solid gray; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Login</h1>
    <form>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" >
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" minlength="8" maxlength="12" title="Password must have 8 to 12 charachters" placeholder="Enter your password">
        <br><br>
        <button type="submit">Login</button>
        
        
        <br><br>
    </form>
    
</body>
</html>
