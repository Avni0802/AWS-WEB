<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LAYOUT</title>

    <style>

        main {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        header,
        footer,
        nav {
            background-color: rgb(175, 227, 232);
            height: 100px;
            width: 400px;
            text-align: center;
            font-size: medium;
            font-weight: bold;
        }

        section {
            display: flex;
            flex-direction: row;
            background-color: rgb(237, 240, 241);
            width: 400px;
            height: 100px;
        }

        .boxes {
            display: flex;
            flex-direction: row;
            width: 400%;
            height: 100%;
            gap: 20px;
        }

        .box {
            flex-grow: 1;
            background-color: #f5bbf5;
        }

    </style>

</head>

<body>

    <main>

        <header>
            <h2>HEADER</h2>
        </header>

        <nav>
            <h2>NAVBAR</h2>
        </nav>

        <section>

            <div class="boxes">

                <div class="box">BOX 1</div>
                <div class="box">BOX 2</div>
                <div class="box">BOX 3</div>
                <div class="box">BOX 4</div>

            </div>

        </section>

        <footer>
            <h2>FOOTER</h2>
        </footer>

    </main>

</body>

</html>
