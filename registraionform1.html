<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRAION FORM</title>
    <style>
        *{
            text-align: center;
        }
        
    </style>
</head>
<body>
    <H1 ></H1>
        REGISTRATION FORM 
    </H1>
    <BR><BR>
    <FORM>
        <LABEL for="name">Name:</LABEL>
        <input type="text" id="name" name="name" placeholder="Enter Your Name "></input>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" minlength="8" maxlength="12" title="Paaword must have 8 to 16 charachters" required
>
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="gender" value="male">Male
        <input type="radio" name="gender" value="female">Female
        <input type="radio" name="gender" value="other">Other
        <br><br>
        <label for="dob">DOB:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>
        <label for="file">Upload File:</label>
        <input type="file" id="file" name="file" required>
        <br><br>
        <label>Subjects:</label>
        <input type="checkbox" name="Subjects" value="maths" required>Mathematics
        <input type="checkbox" name="Subjects" value="physics" required>Physics
        <input type="checkbox" name="Subjects" value="cpp" required>C++
        <input type="checkbox" name="Subjects" value="html" required>HTML
        <br><br>
        
        <button type="submit">Register</button>
        <a href="login.html"> <buttom type="submit">Login</buttom> 
        </a>
        
    </FORM>
    
</body>
</html>
